name: tick

# Penjadwal bot. Vercel Hobby hanya mengizinkan cron harian, jadi untuk timeframe
# 1 jam kita memakai GitHub Actions (gratis) yang memanggil endpoint /api/tick.
#
# Empat kali per jam (menit 7, 22, 37, 52), bukan sekali. Cron GitHub bersifat
# best-effort dan sering telat 30-90 menit; dengan satu jadwal per jam, satu
# keterlambatan membuat candle 1 jam terlewat dan sinyal di candle itu tidak
# pernah dievaluasi. Dengan empat jadwal, masih ada cadangan bila satu run telat.
# Aman karena /api/tick idempoten per candle (state.lastProcessed): panggilan
# tambahan pada candle yang sama hanya mencatat tick, tidak membuat order baru.
# Menit ke-7 (bukan 0) agar tidak bertabrakan dengan lonjakan penjadwal.
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

concurrency:
  group: tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Panggil bot
        env:
          BOT_URL: ${{ secrets.BOT_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -e
          test -n "$BOT_URL" || (echo "secret BOT_URL belum diisi" && exit 1)
          test -n "$CRON_SECRET" || (echo "secret CRON_SECRET belum diisi" && exit 1)
          echo "tick $(date -u +%FT%TZ)"
          curl -sS --fail-with-body --max-time 90 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$BOT_URL/api/tick?source=github-actions" | tee /tmp/tick.json
          echo
